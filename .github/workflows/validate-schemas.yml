name: Validate Schemas

on:
  push:
    paths:
      - "public/schemas/**"
      - ".github/workflows/validate-schemas.yml"

  pull_request:
    paths:
      - "public/schemas/**"
      - ".github/workflows/validate-schemas.yml"

permissions:
  contents: write

jobs:
  validate:
    name: Validate schema registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install validator
        run: npm install --no-save ajv ajv-formats

      - name: Validate schemas
        run: node .github/scripts/validate-schemas.js

      - name: Commit registry changes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/schemas/list.json

          if git diff --cached --quiet; then
            echo "No registry changes."
            exit 0
          fi

          git commit -m "chore(schemas): update schema registry"
          git push
